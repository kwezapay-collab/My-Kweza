<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | My Kweza</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1a4d6e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Kweza">
    <link rel="apple-touch-icon" href="/icons/kweza-192.png">
    <style>
        .main-content {
            overflow: hidden !important;
            height: 100vh;
        }
    </style>
</head>

<body class="scrollable">
    <main class="main-content">
        <div class="settings-container">
            <div class="settings-header-text">
                <h1>Settings</h1>
                <p style="color: var(--text-muted);">Manage your account preferences</p>
            </div>

            <!-- Account Group -->
            <div class="settings-group">
                <button id="toggleProfileFormBtn" class="settings-item">
                    <div class="settings-item-icon"><i data-lucide="user"></i></div>
                    <div class="settings-item-content">
                        <span class="settings-item-title">Profile Information</span>
                    </div>
                    <i data-lucide="chevron-right" class="settings-item-chevron"></i>
                </button>
                <div id="profileFormWrap" class="settings-inline-form" style="display: none;">
                    <form id="profileForm">
                        <div class="input-group">
                            <label>Full Name</label>
                            <input type="text" id="profileName" placeholder="Enter your name" autocomplete="name"
                                maxlength="120" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
                    </form>
                </div>

                <button id="togglePinFormBtn" class="settings-item">
                    <div class="settings-item-icon"><i data-lucide="shield"></i></div>
                    <div class="settings-item-content">
                        <span class="settings-item-title">Privacy & Security</span>
                    </div>
                    <i data-lucide="chevron-right" class="settings-item-chevron"></i>
                </button>
                <div id="pinFormWrap" class="settings-inline-form" style="display: none;">
                    <form id="pinForm">
                        <div class="input-group">
                            <label>Current PIN</label>
                            <input type="password" id="oldPin" placeholder="••••" maxlength="4" required>
                        </div>
                        <div class="input-group">
                            <label>New PIN</label>
                            <input type="password" id="newPin" placeholder="••••" maxlength="4" required>
                        </div>
                        <button type="submit" class="btn btn-primary"
                            style="width: 100%; background: var(--accent);">Update PIN</button>
                    </form>
                </div>

            </div>

            <!-- Preferences Group -->
            <div class="settings-group">
                <button id="themeToggleBtn" class="settings-item">
                    <div class="settings-item-icon"><i data-lucide="sun"></i></div>
                    <div class="settings-item-content">
                        <span class="settings-item-title">Dark Mode</span>
                    </div>
                    <div id="themeSwitch" class="settings-switch"></div>
                </button>

                <div class="settings-item">
                    <div class="settings-item-icon"><i data-lucide="bell"></i></div>
                    <div class="settings-item-content">
                        <span class="settings-item-title">Notifications</span>
                    </div>
                    <div class="settings-switch active"></div>
                </div>

                <div class="settings-item">
                    <div class="settings-item-icon"><i data-lucide="database"></i></div>
                    <div class="settings-item-content">
                        <span class="settings-item-title">Save History</span>
                    </div>
                    <div class="settings-switch active"></div>
                </div>

                <div class="settings-item">
                    <div class="settings-item-icon"><i data-lucide="languages"></i></div>
                    <div class="settings-item-content">
                        <span class="settings-item-title">Language</span>
                    </div>
                    <span class="settings-item-value">English</span>
                    <i data-lucide="chevron-right" class="settings-item-chevron"></i>
                </div>

                <div class="settings-item">
                    <div class="settings-item-icon"><i data-lucide="help-circle"></i></div>
                    <div class="settings-item-content">
                        <span class="settings-item-title">Help Center</span>
                    </div>
                    <i data-lucide="chevron-right" class="settings-item-chevron"></i>
                </div>

                <div class="settings-item">
                    <div class="settings-item-icon"><i data-lucide="info"></i></div>
                    <div class="settings-item-content">
                        <span class="settings-item-title">About</span>
                    </div>
                    <i data-lucide="chevron-right" class="settings-item-chevron"></i>
                </div>
            </div>
        </div>
    </main>

    <script src="responsive-tables.js"></script>
    <script src="settings.js"></script>

    <script src='/pwa.js'></script>
</body>

</html>
